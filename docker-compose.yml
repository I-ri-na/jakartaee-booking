services:
  db:
    image: postgres:16-alpine
    environment:
      # Значения должны совпадать с post-boot-commands.asadmin (booking/booking/booking)
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
    ports:
      - "5432:5432"
    volumes:
      - ./init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payara:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "4848:4848"
